name: Resume Agent Build

  run-name: Resume Agent build - ${{ github.ref_name }}

  on:
    push:
      branches: [ "main", "master" ]
    pull_request:
    workflow_dispatch:

  permissions:
    contents: read

  jobs:
    build:
      runs-on: ubuntu-latest
      env:
        ANDROID_HOME: /usr/local/lib/android/sdk
        ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      steps:
        - name: Checkout
          uses: actions/checkout@v4

        - name: Confirm workflow revision
          run: echo "Resume Agent workflow v2 - no setup-android action"

        - name: Set up JDK 17
          uses: actions/setup-java@v4
          with:
            distribution: temurin
            java-version: '17'
            cache: gradle

        - name: Install Android SDK packages
          run: |
            if [ -x "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" ]; then
              SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
            else
              SDKMANAGER="$(find "$ANDROID_SDK_ROOT/cmdline-tools" -path '*/bin/sdkmanager' -type f | head -1)"
            fi
            test -x "$SDKMANAGER"
            yes | "$SDKMANAGER" --licenses > /dev/null || true
            yes | "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

        - name: Configure Android SDK path
          run: |
            test -d "$ANDROID_SDK_ROOT/platforms/android-35"
            echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties

        - name: Set up Gradle
          uses: gradle/actions/setup-gradle@v4
          with:
            gradle-version: '8.9'

        - name: Restore optional signing key
          env:
            ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          run: |
            if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
              printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/resume-agent-stable.jks"
            fi

        - name: Verify project layout
          run: |
            test -f settings.gradle.kts
            test -f build.gradle.kts
            test -f app/build.gradle.kts
            grep -q 'include(":app")' settings.gradle.kts

        - name: Run tests and assemble debug APK
          env:
            ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/resume-agent-stable.jks
            ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
            ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
            ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          run: gradle :app:testDebugUnitTest :app:assembleDebug --stacktrace --no-build-cache

        - name: Verify APK exists
          run: |
            test -s app/build/outputs/apk/debug/app-debug.apk
            "$ANDROID_SDK_ROOT/build-tools/35.0.0/aapt2" dump badging \
              app/build/outputs/apk/debug/app-debug.apk

        - name: Upload debug APK
          uses: actions/upload-artifact@v4
          with:
            name: resume-agent-debug-apk
            path: app/build/outputs/apk/debug/app-debug.apk
